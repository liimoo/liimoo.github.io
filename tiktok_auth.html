<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>TikTok 連携コード | 日本地図 都市パズル</title>
<body style="font-family:sans-serif;max-width:640px;margin:3em auto;padding:0 1em">
<h2>TikTok 連携コード</h2>
<p>下のコードをコピーして、ターミナル（post_tiktok.py --login）に貼り付けてください。</p>
<textarea id="c" style="width:100%;height:6em;font-size:14px" readonly></textarea>
<p><button onclick="navigator.clipboard.writeText(document.getElementById('c').value)">コピー</button></p>
<script>
const code = new URLSearchParams(location.search).get("code");
document.getElementById("c").value = code || "(code パラメータがありません)";
</script>
</body>
</html>
