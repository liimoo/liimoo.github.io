<body>
  <div class="top"><a href="/">🗾 日本地図 都市パズル</a>　<span style="opacity:.9;font-size:.86em">｜ <a href="/play/">遊ぶ</a>・<a href="/event/">対抗戦</a>・<a href="/players/">ランキング</a>・<a href="/videos/">プレイ動画</a>・<a href="/news/">お知らせ</a></span></div>
  <div class="wrap">
    <nav class="crumb"><a href="/">ホーム</a> › プレイヤーランキング</nav>
    <h1>🏆 プレイヤーランキング（総合）</h1>
    <p class="lead">パズルやクイズをクリアするほどたまるポイントの、全国／都道府県別ランキング。あなたは全国何位？</p>

    <div class="controls">
      <span class="tabs" id="modeTabs">
        <button data-m="all" class="on">総合</button>
        <button data-m="puzzle">パズル</button>
        <button data-m="quiz">クイズ</button>
      </span>
      <label>地域：<select id="pref"></select></label>
    </div>
    <p class="upd" id="upd"></p>

    <div id="board"><p class="muted">読み込み中…</p></div>

    <div class="cta">
      <b>🎮 ランキングに参加（無料）</b><br>
      サインインして遊べば、あなたの記録が全国・都道府県のランキングに反映されます。都道府県対抗の順位はこちら → <a href="/event/">都道府県対抗</a>
      <br><a class="btn" href="/">アプリを見る</a>
    </div>

    <p><a href="/event/">🏁 都道府県対抗</a>　｜　<a href="/ranking/">日本地図の豆知識</a>　｜　<a href="/">トップへ</a></p>

<script>
const SUPABASE="https://djgafiowdldqtearqtdd.supabase.co";
const ANON="sb_publishable_sPdzya_DNqn3uTglBjvn7w_tKugUATk";
const PREF={ "01":"北海道","02":"青森県","03":"岩手県","04":"宮城県","05":"秋田県","06":"山形県","07":"福島県",
 "08":"茨城県","09":"栃木県","10":"群馬県","11":"埼玉県","12":"千葉県","13":"東京都","14":"神奈川県","15":"新潟県",
 "16":"富山県","17":"石川県","18":"福井県","19":"山梨県","20":"長野県","21":"岐阜県","22":"静岡県","23":"愛知県",
 "24":"三重県","25":"滋賀県","26":"京都府","27":"大阪府","28":"兵庫県","29":"奈良県","30":"和歌山県","31":"鳥取県",
 "32":"島根県","33":"岡山県","34":"広島県","35":"山口県","36":"徳島県","37":"香川県","38":"愛媛県","39":"高知県",
 "40":"福岡県","41":"佐賀県","42":"長崎県","43":"熊本県","44":"大分県","45":"宮崎県","46":"鹿児島県","47":"沖縄県" };
const MEDAL=["🥇","🥈","🥉"];
let mode="all";
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function num(n){ return Number(n||0).toLocaleString("ja-JP"); }
function jstDate(iso){ if(!iso) return ""; return new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",month:"long",day:"numeric",hour:"2-digit",minute:"2-digit"}).format(new Date(iso)); }

// 地域プルダウン（全国＋47県）
(function(){
  const sel=document.getElementById("pref");
  let o=['<option value="">全国</option>'];
  for(let i=1;i<=47;i++){ const k=String(i).padStart(2,"0"); o.push(`<option value="${k}">${PREF[k]}</option>`); }
  sel.innerHTML=o.join(""); sel.onchange=render;
})();
document.querySelectorAll("#modeTabs button").forEach(b=>{
  b.onclick=()=>{ mode=b.dataset.m; document.querySelectorAll("#modeTabs button").forEach(x=>x.classList.toggle("on",x===b)); render(); };
});

async function render(){
  const pref=document.getElementById("pref").value;
  const board=document.getElementById("board"), upd=document.getElementById("upd");
  board.innerHTML='<p class="muted">読み込み中…</p>'; upd.textContent="";
  let d;
  try{
    const r=await fetch(`${SUPABASE}/functions/v1/get-ranking`,{method:"POST",
      headers:{"Content-Type":"application/json","apikey":ANON,"Authorization":"Bearer "+ANON},
      body:JSON.stringify({scope:pref?"pref":"total", scope_id:pref, mode, limit:100})});
    d=await r.json();
  }catch(e){ board.innerHTML='<p class="muted">読み込みに失敗しました。時間をおいてお試しください。</p>'; return; }
  const rows=d.entries||[];
  if(d.refreshed_at) upd.textContent="最終更新："+jstDate(d.refreshed_at);
  if(!rows.length){ board.innerHTML='<p class="muted">まだランキングがありません。</p>'; return; }
  const head=`<tr><th class="l">順位</th><th class="l">プレイヤー</th><th>ポイント</th><th>コース</th></tr>`;
  const body=rows.map((r,i)=>`<tr>
    <td class="rank l">${i<3?MEDAL[i]+" ":""}${r.rank}</td>
    <td class="name l">${esc(r.name||"（名前なし）")}</td>
    <td>${num(r.points)}</td>
    <td>${num(r.boards)}</td>
  </tr>`).join("");
  board.innerHTML=`<table>${head}${body}</table>`;
}
render();
</script>
