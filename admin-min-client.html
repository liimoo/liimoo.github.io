<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>対抗戦 クライアント版 管理</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
         margin: 0; background: #0e1626; color: #e8edf6; line-height: 1.6; }
  header { background: #142036; padding: 14px 18px; position: sticky; top: 0; display: flex;
           align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid #24344f; z-index: 10; }
  header h1 { font-size: 1.1em; margin: 0; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 16px; }
  input, button { font-size: 15px; }
  input { padding: 9px 11px; border-radius: 9px; border: 1px solid #2c3e5d;
          background: #0b1322; color: #e8edf6; }
  button { padding: 9px 14px; border-radius: 9px; border: 0; cursor: pointer; font-weight: 700; color: #fff; }
  .b-blue { background: #2a64c0; } .b-gray { background: #5a6b86; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .card { background: #16233c; border: 1px solid #26385a; border-radius: 14px; padding: 14px; margin: 12px 0; }
  .card.running { border-color: #1f9d57; box-shadow: 0 0 0 1px #1f9d5766 inset; }
  .title { font-weight: 700; font-size: 15px; }
  .meta { font-size: 12px; color: #9fb0cc; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; margin-right: 6px; }
  .p-running { background: #1c5e38; } .p-upcoming { background: #1f3b6b; } .p-ended { background: #3a4152; color: #b9c2d2; }
  .muted { color: #9fb0cc; }
  .note { font-size: 12px; min-height: 1.1em; margin-top: 8px; }
  .ok { color: #7fe0a3; } .err { color: #ff9b8f; }
  .hint { background: #1a2c14; border: 1px solid #2f5222; border-radius: 12px; padding: 13px 15px;
          font-size: 13px; margin: 12px 0 18px; }
  .hint b { color: #cdeeb8; }
  code { background: #0b1322; padding: 1px 6px; border-radius: 5px; color: #ffd27a; }
  #login { max-width: 360px; margin: 8vh auto; display: grid; gap: 12px; }
  .spacer { flex: 1; }
  .hidden { display: none !important; }
  .verinput { width: 130px; }
  a.link { color: #7fb0ff; }
</style>
</head>
<body>

<div id="login" class="wrap">
  <h1>🚩 対抗戦 版管理ログイン</h1>
  <input id="email" type="email" placeholder="管理者メール" autocomplete="username">
  <input id="password" type="password" placeholder="パスワード" autocomplete="current-password">
  <button class="b-blue" onclick="login()">ログイン</button>
  <div id="loginmsg" class="muted" style="font-size:13px"></div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>🚩 対抗戦 クライアント版</h1>
    <button class="b-gray" onclick="load()">更新</button>
    <span id="msg" class="meta"></span>
    <span class="spacer"></span>
    <a class="b-gray" href="./admin.html" style="text-decoration:none;padding:9px 14px;border-radius:9px">💬 みんなの声</a>
    <button class="b-gray" onclick="logout()">ログアウト</button>
  </header>
  <div class="wrap">
    <div class="hint">
      <b>min_client</b> は「この対抗戦をちゃんと遊べる最低クライアント版」です。これ未満の旧クライアントが
      対抗戦を開くと <b>アップデートうながし</b>（お知らせのみ・遊びはブロックしない）が出ます。<br>
      ・空 = うながしなし　・効くのは <b>「開催中」</b> のシーズンの値だけ　・
      いまの配信版以下を入れると誰にも出ません（例 <code>2.1.0</code>）。
    </div>
    <div id="list"></div>
  </div>
</div>

<script>
const SUPABASE = "https://djgafiowdldqtearqtdd.supabase.co";
const ANON = "sb_publishable_sPdzya_DNqn3uTglBjvn7w_tKugUATk";
let token = sessionStorage.getItem("jm_admin_token") || "";
const STATE_JP = { running: "開催中", upcoming: "開催前", ended: "終了" };

function esc(s){ return String(s??"").replace(/[&<>"']/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function setMsg(t){ document.getElementById("msg").textContent = t||""; }

async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  document.getElementById("loginmsg").textContent = "ログイン中…";
  try {
    const r = await fetch(`${SUPABASE}/auth/v1/token?grant_type=password`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": ANON },
      body: JSON.stringify({ email, password }),
    });
    const d = await r.json();
    if (!r.ok || !d.access_token) { document.getElementById("loginmsg").textContent = "ログイン失敗: " + (d.error_description||d.msg||r.status); return; }
    token = d.access_token;
    sessionStorage.setItem("jm_admin_token", token);
    showApp();
  } catch(e){ document.getElementById("loginmsg").textContent = "通信エラー: " + e; }
}

function logout(){ token=""; sessionStorage.removeItem("jm_admin_token");
  document.getElementById("app").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden"); }

function showApp(){ document.getElementById("loginmsg").textContent="";
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden"); load(); }

async function api(action, params){
  const r = await fetch(`${SUPABASE}/functions/v1/admin`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "apikey": ANON, "Authorization": "Bearer " + token },
    body: JSON.stringify(Object.assign({ action }, params||{})),
  });
  const d = await r.json().catch(()=>({}));
  if (r.status === 401 || r.status === 403) { setMsg("権限がありません（再ログインしてください）"); throw new Error("auth"); }
  if (!r.ok) { setMsg("エラー: " + (d.error||r.status)); throw new Error(d.error||r.status); }
  return d;
}

async function load(){
  setMsg("読み込み中…");
  try {
    const d = await api("event_seasons");
    setMsg("");
    render(d.seasons||[]);
  } catch(e){}
}

function render(seasons){
  const box = document.getElementById("list");
  if (!seasons.length){ box.innerHTML = '<p class="muted">シーズンがありません。</p>'; return; }
  box.innerHTML = "";
  for (const s of seasons){
    const card = document.createElement("div");
    card.className = "card" + (s.state === "running" ? " running" : "");
    const period = (s.starts_at||"").slice(0,10) + " 〜 " + (s.ends_at||"").slice(0,10);
    card.innerHTML = `
      <div class="row">
        <span class="pill p-${s.state}">${STATE_JP[s.state]||s.state}</span>
        <span class="title">#${s.id} ${esc(s.title||"(無題)")}</span>
        <span class="meta">${period}</span>
      </div>
      <div class="row" style="margin-top:10px">
        <label class="meta">min_client</label>
        <input class="verinput" type="text" value="${esc(s.min_client||"")}" placeholder="(空=なし)" data-id="${s.id}">
        <button class="b-blue" data-save="${s.id}">保存</button>
        <button class="b-gray" data-clear="${s.id}">空にする</button>
        <span class="spacer"></span>
      </div>
      <div class="note muted" data-note="${s.id}"></div>`;
    box.appendChild(card);
  }
  box.querySelectorAll("button[data-save]").forEach(b =>
    b.onclick = () => save(b.getAttribute("data-save")));
  box.querySelectorAll("button[data-clear]").forEach(b =>
    b.onclick = () => { const id=b.getAttribute("data-clear");
      box.querySelector(`input[data-id="${id}"]`).value=""; save(id); });
}

async function save(id){
  const input = document.querySelector(`input[data-id="${id}"]`);
  const note = document.querySelector(`[data-note="${id}"]`);
  const val = input.value.trim();
  if (!/^(\d+(\.\d+){0,3})?$/.test(val)){
    note.textContent = "✗ 空か「2.1.0」のような数字だけの版にしてください。";
    note.className = "note err"; return;
  }
  note.textContent = "保存中…"; note.className = "note muted";
  try {
    const d = await api("set_min_client", { season_id: Number(id), min_client: val });
    note.textContent = "✓ 保存しました（min_client = '" + (d.row?.min_client||"") + "'）";
    note.className = "note ok";
  } catch(e){
    note.textContent = "✗ 保存に失敗しました。"; note.className = "note err";
  }
}

if (token) showApp();
</script>
</body>
</html>
