<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>みんなの声 管理</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
         margin: 0; background: #0e1626; color: #e8edf6; line-height: 1.6; }
  header { background: #142036; padding: 14px 18px; position: sticky; top: 0; display: flex;
           align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid #24344f; }
  header h1 { font-size: 1.1em; margin: 0; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 16px; }
  input, select, button { font-size: 15px; }
  input, select { padding: 9px 11px; border-radius: 9px; border: 1px solid #2c3e5d;
                  background: #0b1322; color: #e8edf6; }
  button { padding: 9px 14px; border-radius: 9px; border: 0; cursor: pointer; font-weight: 700; color: #fff; }
  .b-blue { background: #2a64c0; } .b-green { background: #1f9d57; } .b-gray { background: #5a6b86; }
  .b-orange { background: #d9742a; } .b-red { background: #c0392b; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .card { background: #16233c; border: 1px solid #26385a; border-radius: 14px; padding: 14px; margin: 12px 0; }
  .body { font-size: 16px; white-space: pre-wrap; word-break: break-word; margin: 4px 0 8px; }
  .meta { font-size: 12px; color: #9fb0cc; }
  .pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; margin-right: 6px; }
  .p-pending { background: #6b5a16; } .p-approved { background: #1c5e38; } .p-rejected { background: #6a2730; }
  .muted { color: #9fb0cc; }
  .ulink { color: #7fb0ff; text-decoration: underline; cursor: pointer; }
  .ulink:hover { color: #a9caff; }
  #login { max-width: 360px; margin: 8vh auto; display: grid; gap: 12px; }
  #msg { color: #ffd27a; min-height: 1.2em; font-size: 13px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="login" class="wrap">
  <h1>みんなの声 管理ログイン</h1>
  <input id="email" type="email" placeholder="管理者メール" autocomplete="username">
  <input id="password" type="password" placeholder="パスワード" autocomplete="current-password">
  <button class="b-blue" onclick="login()">ログイン</button>
  <div id="loginmsg" class="muted" style="font-size:13px"></div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>💬 みんなの声 管理</h1>
    <select id="filter" onchange="load()">
      <option value="approved" selected>公開中</option>
      <option value="pending">承認待ち</option>
      <option value="reported">通報あり</option>
      <option value="rejected">却下</option>
      <option value="all">すべて</option>
      <option value="banned">BAN済みユーザー</option>
      <option value="reporters">通報者ランキング</option>
      <option value="profiles_pending">プロフィール承認待ち</option>
      <option value="profiles_reported">プロフィール通報あり</option>
      <option value="moderation">🚩 通報された投稿(対抗戦/占い)</option>
      <option value="live_team_cheer">📣 対抗戦の応援コメント</option>
      <option value="live_team_labor">💐 対抗戦のねぎらいコメント</option>
      <option value="live_fortune">🔮 占いの今日のひとこと</option>
      <option value="scores">🏆 ランキング記録</option>
      <option value="player_clears">🕵️ プレイヤー取得履歴（対抗戦）</option>
    </select>
    <select id="kindfilter" onchange="load()">
      <option value="">種類：すべて</option>
      <option value="voice">地域紹介</option>
      <option value="cheer">応援</option>
      <option value="praise">お祝い</option>
    </select>
    <button class="b-gray" onclick="load()">更新</button>
    <span id="msg"></span>
    <span style="margin-left:auto"></span>
    <a class="b-gray" href="./feedback.html" style="text-decoration:none;padding:9px 14px;border-radius:9px">📮 ごいけん・ふぐあい</a>
    <a class="b-gray" href="./admin_event.html" style="text-decoration:none;padding:9px 14px;border-radius:9px">🚩 対抗戦</a>
    <a class="b-gray" href="./game-config.html" style="text-decoration:none;padding:9px 14px;border-radius:9px">⚙️ ゲーム設定</a>
    <a class="b-gray" href="./admin_analytics.html" style="text-decoration:none;padding:9px 14px;border-radius:9px">📈 アクセス</a>
    <button class="b-gray" onclick="logout()">ログアウト</button>
  </header>
  <div class="wrap"><div id="list"></div></div>
</div>

<script>
const SUPABASE = "https://djgafiowdldqtearqtdd.supabase.co";
const ANON = "sb_publishable_sPdzya_DNqn3uTglBjvn7w_tKugUATk";
let token = sessionStorage.getItem("jm_admin_token") || "";
let CITY = null;   // {prefs:{"01":"北海道"...}, codes:{code:"都道府県 市区町村"...}}

async function fetchCities(){
  if (CITY) return;
  try { const r = await fetch("./admin-cities.json"); CITY = await r.json(); } catch(e){ CITY = null; }
}
function cityName(code){
  if (!CITY || !code) return code;
  if (CITY.codes[code]) return CITY.codes[code];
  if (code.indexOf("|") >= 0){ const a = code.split("|"); return (CITY.prefs[a[0]]||"") + " " + a[1]; }
  return code;
}

function esc(s){ return String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }

// 日時は DB から UTC で届く。管理ページは日本時間で判断するので必ず JST へ直して出す。
// ⚠ そのまま slice すると9時間前に見える。実際に「昨夜20時台の投稿がランキングに
//    入っていない」と誤解する原因になった（実際は当日早朝5時台＝集計後の投稿だった）。
function jst(s){
  if(!s) return "";
  const d = new Date(s);
  if(isNaN(d.getTime())) return String(s).replace("T"," ").slice(0,16);
  const p = new Intl.DateTimeFormat("ja-JP", {timeZone:"Asia/Tokyo", year:"numeric",
    month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hour12:false})
    .formatToParts(d).reduce((a,x)=>(a[x.type]=x.value,a),{});
  return `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute}`;
}

function setMsg(t){ document.getElementById("msg").textContent = t||""; }

async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  document.getElementById("loginmsg").textContent = "ログイン中…";
  try {
    const r = await fetch(`${SUPABASE}/auth/v1/token?grant_type=password`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": ANON },
      body: JSON.stringify({ email, password }),
    });
    const d = await r.json();
    if (!r.ok || !d.access_token) { document.getElementById("loginmsg").textContent = "ログイン失敗: " + (d.error_description||d.msg||r.status); return; }
    token = d.access_token;
    sessionStorage.setItem("jm_admin_token", token);
    showApp();
  } catch(e){ document.getElementById("loginmsg").textContent = "通信エラー: " + e; }
}

function logout(){ token=""; sessionStorage.removeItem("jm_admin_token"); document.getElementById("app").classList.add("hidden"); document.getElementById("login").classList.remove("hidden"); }

async function showApp(){ document.getElementById("loginmsg").textContent=""; document.getElementById("login").classList.add("hidden"); document.getElementById("app").classList.remove("hidden"); await fetchCities();
  // admin_event.html などから ?clears=<user_id> で来たら「プレイヤー取得履歴」を自動で開く。
  const qc = new URLSearchParams(location.search).get("clears");
  if (qc){ CLEARS_UID = qc; document.getElementById("filter").value = "player_clears"; }
  load(); }

async function api(action, params){
  const r = await fetch(`${SUPABASE}/functions/v1/admin`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "apikey": ANON, "Authorization": "Bearer " + token },
    body: JSON.stringify(Object.assign({ action }, params||{})),
  });
  const d = await r.json().catch(()=>({}));
  if (r.status === 401 || r.status === 403) { setMsg("権限がありません（再ログインしてください）"); throw new Error("auth"); }
  if (!r.ok) { setMsg("エラー: " + (d.error||r.status)); throw new Error(d.error||r.status); }
  return d;
}

async function load(){
  setMsg("読み込み中…");
  try {
    const status = document.getElementById("filter").value;
    if (status === "banned") {
      const d = await api("list_banned", {});
      renderBanned(d.banned||[]);
      setMsg(`${(d.banned||[]).length} 人`);
      return;
    }
    if (status === "reporters") {
      const d = await api("report_stats", {});
      renderReporters(d.reporters||[]);
      setMsg(`${(d.reporters||[]).length} 人`);
      return;
    }
    if (status === "profiles_pending" || status === "profiles_reported") {
      const filter = status === "profiles_pending" ? "pending" : "reported";
      const d = await api("list_profiles", { filter, limit: 200 });
      renderProfiles(d.profiles||[]);
      setMsg(`${(d.profiles||[]).length} 件`);
      return;
    }
    if (status === "moderation") {
      const d = await api("list_moderation", { status: "open", limit: 200 });
      renderModeration(d.logs||[]);
      setMsg(`${(d.logs||[]).length} 件`);
      return;
    }
    if (status.indexOf("live_") === 0) {
      const channel = status.slice(5);   // team_cheer / team_labor / fortune
      const d = await api("list_live_comments", { channel, status: "all", limit: 300 });
      renderLiveComments(channel, d.comments||[]);
      setMsg(`${(d.comments||[]).length} 件`);
      return;
    }
    if (status === "scores") {
      renderScoresForm();
      setMsg("");
      return;
    }
    if (status === "player_clears") {
      renderClearsForm();
      setMsg("");
      return;
    }
    const kind = document.getElementById("kindfilter").value;
    const d = await api("list", { status, limit: PAGE, kind });
    const rows = d.comments||[];
    render(rows);
    _more = null;
    if (rows.length === PAGE) addMoreButton({ status, kind }, PAGE);
    setMsg(`${rows.length}${rows.length===PAGE?"+":""} 件`);
  } catch(e){ setMsg("読み込み失敗: " + (e && e.message ? e.message : e)); }
}

// ── 🏆 ランキング記録の管理 ────────────────────────────────────────────
let SCORES_BOARD = "";
// 都道府県内のマップ（県全体＋市町村＋政令市）を admin-cities.json から絞り込む。
function mapsForPref(pref){
  const codes = (CITY && CITY.codes) ? CITY.codes : {};
  const out = [];
  for (const k of Object.keys(codes)){
    let inPref = false;
    if (k === pref) inPref = true;                                    // 県全体
    else if (/^\d{5}$/.test(k) && k.slice(0,2) === pref) inPref = true; // 市町村
    else if (k[0] === "S" && k.slice(1,3) === pref) inPref = true;      // 政令市（市全体）
    if (inPref){
      const full = codes[k] || k;
      const sp = full.indexOf(" ");
      const label = (k === pref) ? "県全体" : (sp >= 0 ? full.slice(sp+1) : full);
      out.push({ code:k, label });
    }
  }
  out.sort((a,b)=> (a.code===pref?"":"1")+a.code < (b.code===pref?"":"1")+b.code ? -1 : 1);
  return out;
}
function onPrefPick(){
  const pref = document.getElementById("prefpick").value;
  const sel = document.getElementById("mappick");
  if (!pref){ sel.innerHTML = '<option value="">— マップ —</option>'; return; }
  const maps = mapsForPref(pref);
  sel.innerHTML = maps.map(m => `<option value="${m.code}">${esc(m.label)}（${m.code}）</option>`).join("");
  // 先頭（県全体）を選んで自動表示
  if (maps.length){ sel.value = maps[0].code; onMapPick(); }
}
function onMapPick(){
  const code = document.getElementById("mappick").value;
  if (!code) return;
  document.getElementById("boardid").value = code;
  loadScores();
}
function renderScoresForm(){
  const list = document.getElementById("list");
  const prefs = (CITY && CITY.prefs) ? CITY.prefs : {};
  const opts = Object.keys(prefs).sort().map(c => `<option value="${c}">${c} ${esc(prefs[c])}</option>`).join("");
  list.innerHTML = `
    <div class="card">
      <div class="row" style="margin-bottom:8px">
        <label>都道府県:</label>
        <select id="prefpick" onchange="onPrefPick()">
          <option value="">— 都道府県 —</option>${opts}
        </select>
        <label>マップ:</label>
        <select id="mappick" onchange="onMapPick()">
          <option value="">— マップ —</option>
        </select>
      </div>
      <div class="row" style="margin-bottom:8px">
        <label>board_id:</label>
        <input id="boardid" placeholder="直接入力（例 02, 02201, S01100, quiz:02, GEO_M_0）" value="${esc(SCORES_BOARD)}" style="min-width:280px">
        <button class="b-blue" onclick="loadScores()">表示</button>
      </div>
      <div class="meta">県全体＝2桁県コード（青森＝02）／市町村＝5桁／政令市＝S…／クイズ＝quiz:…／山川＝GEO_…。best_score が小さい＝速い＝上位。</div>
    </div>
    <div id="scorelist"></div>`;
  if (SCORES_BOARD) loadScores();
}
async function loadScores(){
  const board = (document.getElementById("boardid").value||"").trim();
  if (!board){ setMsg("ボードを選んでください"); return; }
  SCORES_BOARD = board;
  setMsg("読み込み中…");
  try {
    const d = await api("list_scores", { board_id: board, limit: 300 });
    renderScores(board, d.scores||[]);
    setMsg(`${(d.scores||[]).length} 件（board ${board}）`);
  } catch(e){ setMsg("読み込み失敗: " + (e && e.message ? e.message : e)); }
}
function fmtScore(cs){ return (cs/100).toFixed(2) + "秒"; }
function renderScores(board, rows){
  const el = document.getElementById("scorelist");
  if (!el) return;
  if (!rows.length){ el.innerHTML = '<p class="muted">この board に記録はありません。</p>'; return; }
  el.innerHTML = rows.map(s => `
    <div class="card">
      <div><span class="pill p-approved">${s.rank}位</span>
        <span class="meta">${esc(s.display_name||"（名前なし）")} ・ ${esc(s.platform||"")} ・ ${esc(jst(s.updated_at))}</span></div>
      <div class="body">${fmtScore(s.best_score)}　<span class="muted">(${s.best_score}cs)</span></div>
      <div class="meta" style="word-break:break-all">user_id: ${esc(s.user_id)}</div>
      <div class="row">
        <button class="b-red" onclick="delScore('${esc(board)}','${esc(s.user_id)}',${s.rank},${s.best_score})">この記録を削除</button>
      </div>
    </div>`).join("");
}
async function delScore(board, user_id, rank, cs){
  if (!confirm(`board ${board} の ${rank}位（${fmtScore(cs)}）\nuser_id: ${user_id}\nこの記録を削除します。よろしいですか？`)) return;
  try {
    await api("delete_score", { board_id: board, user_id });
    setMsg("削除しました");
    loadScores();
  } catch(e){ setMsg("削除失敗: " + (e && e.message ? e.message : e)); }
}

// ── 🕵️ プレイヤー取得履歴（対抗戦・怪しいプレイヤーの調査）─────────────────────
let CLEARS_UID = "";
// board_id → 読みやすいコース名（規約: 2桁=県 / 5桁=市町村 / S…=政令市 / quiz:…=クイズ / GEO_…=山川）。
function boardName(b){
  if (!b) return b;
  if (b === "00") return "全国（パズル）";
  if (b === "quiz:00") return "全国（クイズ）";
  if (/^\d{2}$/.test(b)) return ((CITY&&CITY.prefs[b])||b) + "（県・パズル）";
  if (/^quiz:\d{2}$/.test(b)){ const p=b.slice(5); return ((CITY&&CITY.prefs[p])||p) + "（県・クイズ）"; }
  if (/^\d{5}$/.test(b)) return cityName(b) + "（市町村）";
  if (/^quiz:\d{5}$/.test(b)) return cityName(b.slice(5)) + "（市町村クイズ）";
  if (b[0] === "S") return cityName(b) + "（政令市）";
  if (b.indexOf("GEO") >= 0) return b + "（山・川）";
  return b;
}
function jstTime(iso){
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleString("ja-JP", { timeZone:"Asia/Tokyo", year:"numeric", month:"2-digit",
    day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit" });
}
function fmtGap(sec){
  if (sec == null) return "—";
  if (sec < 60) return sec + "秒";
  if (sec < 3600) return Math.floor(sec/60) + "分" + (sec%60) + "秒";
  return Math.floor(sec/3600) + "時間" + Math.floor((sec%3600)/60) + "分";
}
function renderClearsForm(){
  const list = document.getElementById("list");
  list.innerHTML = `
    <div class="card">
      <div class="row" style="margin-bottom:8px">
        <label>user_id:</label>
        <input id="clearsuid" placeholder="調べたいプレイヤーの user_id（通報一覧やランキング記録から）"
               value="${esc(CLEARS_UID)}" style="min-width:340px">
        <label>季節:</label>
        <input id="clearsseason" placeholder="(空=すべて)" style="width:110px">
        <button class="b-blue" onclick="loadClears()">表示</button>
      </div>
      <div class="meta">対抗戦で「誰が・いつ・どのコースを・何点」取得したかの時系列。加点されたクリアのみ（自動モード=0点は残りません）。
        <b>間隔が極端に短い</b>（数十秒未満で次々）と自動化/不正の疑い。180日で自動削除。</div>
    </div>
    <div id="clearsout"></div>`;
  if (CLEARS_UID) loadClears();
}
async function loadClears(){
  const uid = (document.getElementById("clearsuid").value||"").trim();
  const season = (document.getElementById("clearsseason").value||"").trim();
  if (!uid){ setMsg("user_id を入れてください"); return; }
  CLEARS_UID = uid;
  setMsg("読み込み中…");
  try {
    const d = await api("get_player_clears", { user_id: uid, season_id: season });
    renderClears(d);
    setMsg(`${(d.clears||[]).length} クリア`);
  } catch(e){ setMsg("読み込み失敗: " + (e && e.message ? e.message : e)); }
}
function renderClears(d){
  const el = document.getElementById("clearsout");
  if (!el) return;
  const p = d.profile || {};
  const titles = (p.event_titles||[]).map(t=>esc(t)).join(" / ");
  const entries = (d.entries||[]).map(e =>
    `<div class="meta">季節#${e.season_id}: ${esc(cityName(e.city_code)||e.city_code)}（${esc((CITY&&CITY.prefs[e.pref_code])||e.pref_code)}）… ${e.points}点 / ${e.courses}コース</div>`
  ).join("") || '<div class="meta muted">参加記録なし</div>';

  // クリアを時刻昇順に並べて「前クリアからの間隔」を計算 → 表示は新しい順。
  const clears = (d.clears||[]).slice().sort((a,b)=> new Date(a.cleared_at) - new Date(b.cleared_at));
  const withGap = clears.map((c,i)=>{
    let gap = null;
    if (i>0){ gap = Math.round((new Date(c.cleared_at) - new Date(clears[i-1].cleared_at))/1000); }
    return Object.assign({}, c, { gap });
  }).reverse();

  const header = `
    <div class="card">
      <div class="title">${esc(p.display_name||"（名前なし）")} <span class="meta">・ ${esc(p.platform||"")}</span></div>
      ${titles ? `<div class="meta">称号: ${titles}</div>`:""}
      <div class="meta" style="word-break:break-all">user_id: ${esc(CLEARS_UID)}</div>
      <div style="margin-top:6px">${entries}</div>
    </div>`;

  if (!withGap.length){ el.innerHTML = header + '<p class="muted">この季節のクリア取得履歴はありません（未参加/未クリア、または180日経過で削除済み）。</p>'; return; }

  const rows = withGap.map(c=>{
    const fast = c.gap != null && c.gap < 20;   // 20秒未満で連続=要注意
    return `<tr${fast?' style="background:#3a1a1a"':''}>
      <td style="white-space:nowrap">${esc(jstTime(c.cleared_at))}</td>
      <td>${esc(boardName(c.board_id))} <span class="muted">[${esc(c.board_id)}${c.mode?("・"+esc(c.mode)):""}${c.piece_count?("・"+c.piece_count+"P"):""}]</span></td>
      <td style="text-align:right">${c.points}</td>
      <td style="text-align:right;${fast?'color:#ff9b8f;font-weight:700':''}">${esc(fmtGap(c.gap))}</td>
      <td class="muted">#${c.season_id}</td>
    </tr>`;
  }).join("");
  el.innerHTML = header + `
    <div class="card" style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead><tr style="text-align:left;color:#9fb0cc">
          <th>時刻（JST）</th><th>コース</th><th style="text-align:right">点</th><th style="text-align:right">前から</th><th>季節</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

// ── 🚩 通報された投稿（対抗戦/占い・リセット後も残るスナップショット）──────────
function chLabel(ch){ return ch==="team_cheer"?"応援":ch==="team_labor"?"ねぎらい":ch==="fortune"?"占い":ch; }
function renderModeration(rows){
  const list = document.getElementById("list");
  if (!rows.length){ list.innerHTML = '<p class="muted">未対応の通報はありません。</p>'; return; }
  list.innerHTML = rows.map(r => `
    <div class="card">
      <div><span class="pill p-rejected">🚩 通報 ${r.report_count}</span>
        <span class="pill p-pending">${esc(chLabel(r.channel))}</span>
        <span class="meta">${esc(r.nickname||"（名前なし）")} ・ ${esc(r.platform||"")} ・ ${esc(cityName(r.region)||r.region||"")} ・ ${esc(jst(r.created_at))}</span></div>
      <div class="body">${esc(r.body)}</div>
      <div class="meta">理由: ${esc(r.reason||"（なし）")}</div>
      <div class="meta" style="word-break:break-all">投稿者 user_id: ${esc(r.author_id||"（不明）")}</div>
      <div class="row">
        <button class="b-gray" onclick="resolveModeration(${r.id})">対応済み(削除)</button>
        ${r.author_id ? `<button class="b-blue" onclick="viewUser('${esc(r.author_id)}')">この人の投稿</button>` : ""}
        ${r.author_id ? `<button class="b-red" onclick="banUser('${esc(r.author_id)}')">投稿者をBAN</button>` : ""}
      </div>
    </div>`).join("");
}
async function resolveModeration(id){
  if (!confirm("この通報ログを『対応済み』にして削除します。よろしいですか？")) return;
  try { await api("resolve_moderation", { id }); setMsg("対応済みにしました"); load(); }
  catch(e){ setMsg("失敗: " + (e && e.message ? e.message : e)); }
}

// ── 📣💐🔮 対抗戦/占いの「今あるコメント」（通報有無に関わらず閲覧・非表示）──────
function renderLiveComments(channel, rows){
  const list = document.getElementById("list");
  if (!rows.length){ list.innerHTML = '<p class="muted">コメントはありません。</p>'; return; }
  list.innerHTML = rows.map(c => {
    const hidden = c.status === "rejected";
    const statusPill = hidden ? '<span class="pill p-rejected">非表示</span>' : '<span class="pill p-approved">表示中</span>';
    const rep = c.report_count > 0 ? `<span class="pill p-pending">🚩 ${c.report_count}</span>` : "";
    const toggle = hidden
      ? `<button class="b-green" onclick="setLive('${channel}',${c.id},'approved')">表示に戻す</button>`
      : `<button class="b-orange" onclick="setLive('${channel}',${c.id},'rejected')">非表示にする</button>`;
    return `<div class="card">
      <div>${statusPill}${rep}<span class="meta">${esc(c.nickname||"（名前なし）")} ・ ${esc(c.platform||"")} ・ ${esc(cityName(c.region)||c.region||"")} ・ ${esc(jst(c.created_at))}</span></div>
      <div class="body">${esc(c.body)}</div>
      <div class="meta" style="word-break:break-all">user_id: ${esc(c.author_id||"")}</div>
      <div class="row">
        ${toggle}
        ${c.author_id ? `<button class="b-blue" onclick="viewUser('${esc(c.author_id)}')">この人の投稿</button>` : ""}
        ${c.author_id ? `<button class="b-red" onclick="banUser('${esc(c.author_id)}')">投稿者をBAN</button>` : ""}
      </div>
    </div>`;
  }).join("");
}
async function setLive(channel, id, status){
  try { await api("set_live_comment_status", { channel, id, status }); setMsg(status==="rejected"?"非表示にしました":"表示に戻しました"); load(); }
  catch(e){ setMsg("失敗: " + (e && e.message ? e.message : e)); }
}

function renderBanned(rows){
  const list = document.getElementById("list");
  if (!rows.length){ list.innerHTML = '<p class="muted">BAN中のユーザーはいません。</p>'; return; }
  list.innerHTML = rows.map(b => {
    const name = (b.profiles && b.profiles.display_name) ? b.profiles.display_name : "（名前なし）";
    return `<div class="card">
      <div><span class="pill p-rejected">BAN中</span><span class="meta"><a class="ulink" onclick="viewUser('${esc(b.user_id)}')">${esc(name)}</a> ・ ${esc(jst(b.created_at))}</span></div>
      <div class="body">理由: ${esc(b.reason||"（なし）")}</div>
      <div class="meta" style="word-break:break-all">user_id: ${esc(b.user_id)}</div>
      <div class="row">
        <button class="b-blue" onclick="viewUser('${esc(b.user_id)}')">この人の投稿</button>
        <button class="b-green" onclick="act('unban',{user_id:'${esc(b.user_id)}'})">BAN解除</button>
      </div>
    </div>`;
  }).join("");
}

function renderReporters(rows){
  const list = document.getElementById("list");
  if (!rows.length){ list.innerHTML = '<p class="muted">通報した人はまだいません。</p>'; return; }
  list.innerHTML = rows.map(r => {
    const ut = r.untrusted ? '<span class="pill p-rejected">通報無効</span>' : "";
    const trustBtn = r.untrusted
      ? `<button class="b-green" onclick="setTrust('${esc(r.user_id)}',false)">通報を有効に戻す</button>`
      : `<button class="b-orange" onclick="setTrust('${esc(r.user_id)}',true)">この人の通報を無効化</button>`;
    return `<div class="card">
      <div>${ut}<span class="meta">通報 ${r.count} 件</span></div>
      <div class="body"><a class="ulink" onclick="viewUser('${esc(r.user_id)}')">${esc(r.nickname)}</a></div>
      <div class="row">
        ${trustBtn}
        <button class="b-blue" onclick="viewUser('${esc(r.user_id)}')">この人の投稿</button>
        <button class="b-red" onclick="banUser('${esc(r.user_id)}')">このユーザーをBAN</button>
      </div>
    </div>`;
  }).join("");
}

const PROFILE_ICONS = ["🐱","🐶","🐰","🦊","🐻","🐼","🐨","🦁","🐯","🐸","🐵","🐔","🐧","🦉","🦄","🐴","🐮","🐷","🐹","🐢","🐙","🦀","🐠","🐳","🐝","🦋","🌸","🌻","🌈","🍀","🍎","🍓","🍰","🎈","🎁","⭐","🌟","⛰","🌊","🗾"];

function renderProfiles(rows){
  const list = document.getElementById("list");
  if (!rows.length){ list.innerHTML = '<p class="muted">該当するプロフィールはありません。</p>'; return; }
  list.innerHTML = rows.map(p => {
    const pill = p.public_status==="approved"?'<span class="pill p-approved">公開</span>'
               : p.public_status==="rejected"?'<span class="pill p-rejected">非公開</span>'
               : '<span class="pill p-pending">承認待ち</span>';
    const rep = p.report_count>0 ? `<span class="pill p-rejected">通報 ${p.report_count}</span>` : "";
    const icon = PROFILE_ICONS[p.icon] || "🐱";
    const sns = [];
    if (p.x_handle) sns.push(`X: <a class="ulink" href="https://x.com/${esc(p.x_handle)}" target="_blank" rel="noopener">@${esc(p.x_handle)}</a>`);
    if (p.ig_handle) sns.push(`IG: <a class="ulink" href="https://www.instagram.com/${esc(p.ig_handle)}" target="_blank" rel="noopener">@${esc(p.ig_handle)}</a>`);
    return `<div class="card">
      <div>${pill}${rep}<span class="meta">${icon} ${esc(p.display_name||"（名前なし）")} ・ ${esc(jst(p.updated_at))}</span></div>
      <div class="body">${esc(p.bio||"（自己紹介なし）")}</div>
      ${sns.length ? `<div class="meta">${sns.join(" 　 ")}</div>` : ""}
      ${p.report_reason ? `<div class="meta">通報理由: ${esc(p.report_reason)}</div>` : ""}
      <div class="meta" style="word-break:break-all">user_id: ${esc(p.user_id)}</div>
      <div class="row">
        <button class="b-green" onclick="actProfile('set_profile_status',{user_id:'${esc(p.user_id)}',status:'approved'})">公開を承認</button>
        <button class="b-orange" onclick="actProfile('set_profile_status',{user_id:'${esc(p.user_id)}',status:'rejected'})">非公開にする</button>
        <button class="b-gray" onclick="actProfile('clear_profile',{user_id:'${esc(p.user_id)}'},'自己紹介とSNSを消去して承認済みに戻します。よろしいですか？')">内容クリア</button>
        <button class="b-blue" onclick="viewUser('${esc(p.user_id)}')">この人の投稿</button>
        <button class="b-red" onclick="banUser('${esc(p.user_id)}')">このユーザーをBAN</button>
      </div>
    </div>`;
  }).join("");
}

async function actProfile(action, params, confirmMsg){
  if (confirmMsg && !confirm(confirmMsg)) return;
  try { await api(action, params); await load(); } catch(e){}
}

async function setTrust(user_id, untrusted){
  if (untrusted && !confirm("この人の通報を無効化します。\n以降この人の通報はカウントされず、既存の通報も除外されます。よろしいですか？")) return;
  try { await api("set_trust", { user_id, untrusted }); await load(); } catch(e){}
}

async function showReporters(comment_id){
  try {
    const d = await api("comment_reporters", { comment_id });
    const rs = d.reporters || [];
    if (!rs.length){ alert("通報者はいません。"); return; }
    const lines = rs.map(r => `・${r.nickname}${r.untrusted?"（無効）":""}  理由:${r.reason||"なし"}  ${jst(r.created_at)}`).join("\n");
    alert("通報者（" + rs.length + "人）\n\n" + lines + "\n\n※「通報者ランキング」から個別に無効化できます。");
  } catch(e){}
}

const PAGE = 200;           // 1回の取得件数（サーバ上限と同じ）
let _more = null;            // 「もっと見る」の文脈 {params, offset}

// #more_anchor があればその直前へ、無ければ一覧末尾へHTMLを差し込む
// （ユーザー指定ひょうじでは「この人が通報した投稿」より上に続きを出すため）。
function insertAtAnchor(html){
  const a = document.getElementById("more_anchor");
  if (a) a.insertAdjacentHTML("beforebegin", html);
  else document.getElementById("list").insertAdjacentHTML("beforeend", html);
}

function addMoreButton(params, offset){
  _more = { params, offset };
  insertAtAnchor(`<div class="card" id="morecard"><div class="row"><button class="b-blue" id="morebtn" onclick="loadMore()">▼ もっと見る（つぎの${PAGE}件）</button></div></div>`);
}

async function loadMore(){
  if (!_more) return;
  const btn = document.getElementById("morebtn");
  if (btn){ btn.disabled = true; btn.textContent = "読み込み中…"; }
  try {
    const d = await api("list", Object.assign({}, _more.params, { limit: PAGE, offset: _more.offset }));
    const rows = d.comments || [];
    const card = document.getElementById("morecard");
    if (card) card.remove();
    insertAtAnchor(rows.map(cardHtml).join(""));
    if (rows.length === PAGE) addMoreButton(_more.params, _more.offset + PAGE);
    else _more = null;
    setMsg(`さらに ${rows.length} 件 よみこみました`);
  } catch(e){
    setMsg("読み込み失敗: " + (e && e.message ? e.message : e));
    if (btn){ btn.disabled = false; btn.textContent = `▼ もっと見る（つぎの${PAGE}件）`; }
  }
}

function render(rows){
  const list = document.getElementById("list");
  if (!rows.length){ list.innerHTML = '<p class="muted">該当するコメントはありません。</p>'; return; }
  list.innerHTML = rows.map(cardHtml).join("");
}

function cardHtml(c){
  {
    const pill = c.status==="approved"?'<span class="pill p-approved">公開中</span>'
               : c.status==="rejected"?'<span class="pill p-rejected">却下</span>'
               : '<span class="pill p-pending">承認待ち</span>';
    const rep = c.report_count>0 ? `<span class="pill p-rejected">通報 ${c.report_count}</span>` : "";
    const pin = c.pinned ? '<span class="pill" style="background:#7a2740">📌</span>' : "";
    const kindPill = c.kind==="cheer" ? '<span class="pill" style="background:#8a5a16">📣応援</span>'
                   : (c.kind==="praise"||c.kind==="celebration") ? '<span class="pill" style="background:#7a3a55">🎉お祝い</span>'
                   : '<span class="pill" style="background:#2a5a6a">🗺️紹介</span>';
    const reason = (c.report_count>0 && c.report_reason) ? `<div class="meta" style="color:#ffb0a0">通報理由: ${esc(c.report_reason)}</div>` : "";
    return `<div class="card">
      <div>${kindPill}${pill}${rep}${pin}<span class="meta">${esc(cityName(c.city_code))} ・ <a class="ulink" onclick="viewUser('${esc(c.user_id)}')">${esc(c.nickname)}</a> ・ 👍${c.good_count||0} 👎${c.bad_count||0} ・ ${esc(jst(c.created_at))}</span></div>
      ${reason}
      <div class="body">${esc(c.body)}</div>
      <div class="meta" style="word-break:break-all">user_id: ${esc(c.user_id)}</div>
      <div class="row">
        <button class="b-green" onclick="act('set_status',{comment_id:${c.id},status:'approved'})">承認</button>
        <button class="b-orange" onclick="act('set_status',{comment_id:${c.id},status:'rejected'})">却下</button>
        <button class="b-gray" onclick="act('delete',{comment_id:${c.id}})">削除</button>
        ${c.report_count>0 ? `<button class="b-gray" onclick="showReporters(${c.id})">通報者</button>` : ""}
        <button class="b-blue" onclick="viewUser('${esc(c.user_id)}')">この人の投稿</button>
        <button class="b-red" onclick="banUser('${esc(c.user_id)}')">このユーザーをBAN</button>
      </div>
    </div>`;
  }
}

async function viewUser(uid){
  setMsg("読み込み中…");
  try {
    const d = await api("list", { user_id: uid, limit: PAGE });
    const rows = d.comments || [];
    render(rows);
    // 続き（もっと見る）の差し込み位置＝コメント末尾（通報一覧より上）。
    document.getElementById("list").insertAdjacentHTML("beforeend", '<div id="more_anchor"></div>');
    _more = null;
    if (rows.length === PAGE) addMoreButton({ user_id: uid }, PAGE);
    // 先頭に「どのユーザーを見ているか」の見出し（uuid・ニックネーム・戻る）を差し込む。
    const list = document.getElementById("list");
    const nick = rows.length ? rows[0].nickname : "（このユーザーの投稿はありません）";
    const banner = document.createElement("div");
    banner.className = "card";
    banner.style.borderLeft = "5px solid #2a64c0";
    banner.innerHTML = `<div><span class="pill" style="background:#2a64c0">ユーザー指定ひょうじ</span><span class="meta">${esc(nick)} さんの投稿</span></div>
      <div class="meta" style="word-break:break-all;user-select:all">user_id: ${esc(uid)}</div>
      <div class="row">
        <button class="b-gray" onclick="load()">← 通常一覧にもどる</button>
        <button class="b-red" onclick="banUser('${esc(uid)}')">このユーザーをBAN</button>
      </div>`;
    list.insertBefore(banner, list.firstChild);
    // この人が「通報した」投稿の一覧を下に追加
    let reports = [];
    try { const rd = await api("reports_by_user", { user_id: uid }); reports = rd.reports || []; } catch(e){}
    list.insertAdjacentHTML("beforeend", renderUserReports(reports));
    setMsg(`このユーザーの投稿 ${rows.length}${rows.length===PAGE?"+":""} 件 ・ 通報 ${reports.length} 件`);
  } catch(e){ setMsg("読み込み失敗: " + (e && e.message ? e.message : e)); }
}

// 「この人が通報した投稿」セクションのHTML。
function renderUserReports(reports){
  let html = `<div class="card" style="border-left:5px solid #c0392b"><div><span class="pill p-rejected">この人が通報した投稿</span><span class="meta">${reports.length} 件</span></div></div>`;
  if (!reports.length){ return html + '<p class="muted">通報はありません。</p>'; }
  html += reports.map(r => {
    const c = r.comments || null;
    const when = jst(r.created_at);
    if (!c || !c.id){
      return `<div class="card"><div><span class="pill" style="background:#8a5a16">通報: ${esc(r.reason||"なし")}</span><span class="meta">${esc(when)}</span></div><div class="body muted">（対象コメントは削除されています）</div></div>`;
    }
    const statusPill = c.status==="approved"?'<span class="pill p-approved">公開中</span>'
                     : c.status==="rejected"?'<span class="pill p-rejected">却下</span>'
                     : '<span class="pill p-pending">承認待ち</span>';
    const kindLbl = c.kind==="cheer"?"📣応援":(c.kind==="praise"||c.kind==="celebration")?"🎉お祝い":"🗺️紹介";
    return `<div class="card">
      <div><span class="pill" style="background:#8a5a16">通報: ${esc(r.reason||"なし")}</span>${statusPill}<span class="meta">${esc(kindLbl)} ・ ${esc(cityName(c.city_code))} ・ ${esc(c.nickname||"")} ・ ${esc(when)}</span></div>
      <div class="body">${esc(c.body||"")}</div>
      <div class="meta" style="word-break:break-all">投稿者 user_id: ${esc(c.user_id||"")}</div>
      <div class="row">
        <button class="b-orange" onclick="act('set_status',{comment_id:${c.id},status:'rejected'})">この投稿を却下</button>
        <button class="b-gray" onclick="act('delete',{comment_id:${c.id}})">この投稿を削除</button>
        <button class="b-blue" onclick="viewUser('${esc(c.user_id)}')">投稿者を見る</button>
      </div>
    </div>`;
  }).join("");
  return html;
}

async function act(action, params){
  try { await api(action, params); await load(); } catch(e){}
}

async function banUser(user_id){
  if (!confirm("このユーザーをBANします。\n以降の投稿が禁止され、過去の投稿も非表示になります。よろしいですか？")) return;
  const reason = prompt("BAN理由（任意・メモ）", "") || "";
  try { await api("ban", { user_id, reason }); setMsg("BANしました"); await load(); } catch(e){}
}
