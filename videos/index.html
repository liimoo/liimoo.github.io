<script>
const SUPABASE = "https://djgafiowdldqtearqtdd.supabase.co";
const ANON = "sb_publishable_sPdzya_DNqn3uTglBjvn7w_tKugUATk";
function esc(s){ return String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function plat(p){ return ({youtube:"YouTube", twitch:"Twitch", tiktok:"TikTok"})[p] || "配信"; }
function render(rows){
  const list = document.getElementById("list");
  if(!rows.length){ list.innerHTML = '<p class="muted">ただいま準備中です。もうしばらくお待ちください。</p>'; return; }
  list.innerHTML = rows.map(c => {
    const url = esc(c.video_url || c.channel_url || "#");
    const thumb = c.thumbnail_url
      ? `<img src="${esc(c.thumbnail_url)}" alt="" loading="lazy">`
      : '<span class="ph">▶</span>';
    const sub = esc(plat(c.platform)) + (c.note ? " ・ " + esc(c.note) : "");
    return `<a class="vcard" href="${url}" target="_blank" rel="noopener">
      <span class="vthumb">${thumb}</span>
      <span class="vmeta"><b>${esc(c.name)}</b><small>${sub}</small></span></a>`;
  }).join("");
}
(async function load(){
  try{
    const r = await fetch(`${SUPABASE}/functions/v1/get-creators`, {
      method:"POST",
      headers:{ "Content-Type":"application/json", "apikey":ANON, "Authorization":"Bearer "+ANON },
      body: JSON.stringify({ limit: 200 }),
    });
    const d = await r.json();
    render(d.creators || []);
  }catch(e){
    document.getElementById("list").innerHTML = '<p class="muted">読み込みに失敗しました。時間をおいて再度お試しください。</p>';
  }
})();
