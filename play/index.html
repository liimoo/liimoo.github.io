<script>
(function(){
  var SVGNS = "http://www.w3.org/2000/svg";
  var SNAP = 58.32, NP = 23, FONT = 33.7, PNAME = 20.89;
  var board = document.getElementById('board');
  var placed = document.getElementById('placed');
  var tray = document.getElementById('tray');
  var progEl = document.getElementById('prog'), timeEl = document.getElementById('time');
  var winEl = document.getElementById('win');
  var solved = 0, started = false, t0 = 0, done = false, raf = 0;

  /* ---- 効果音（Web Audio 合成・素材ファイル不要） ---- */
  var AC = null, muted = false;
  function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(AC && AC.state === 'suspended'){ AC.resume(); } return AC; }
  function beep(freq, dur, type, vol, delay){
    if(muted) return; var c = ac(); if(!c) return;
    var o = c.createOscillator(), g = c.createGain();
    o.type = type||'sine'; o.frequency.value = freq; o.connect(g); g.connect(c.destination);
    var t = c.currentTime + (delay||0);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol||0.2, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.start(t); o.stop(t+dur+0.03);
  }
  function sePick(){ beep(300, 0.06, 'triangle', 0.12); }
  function seSnap(){ beep(620, 0.08, 'sine', 0.2); beep(880, 0.12, 'sine', 0.2, 0.06); }
  function seClear(){ [523,659,784,1047].forEach(function(f,i){ beep(f, 0.2, 'sine', 0.22, i*0.11); }); }

  /* ---- タイマー ---- */
  function tick(){ if(done) return; timeEl.textContent = ((Date.now()-t0)/1000).toFixed(1); raf = requestAnimationFrame(tick); }
  function startTimer(){ if(!started){ started = true; t0 = Date.now(); tick(); } }

  /* ---- ボード座標へ変換 ---- */
  function toBoard(clientX, clientY){
    var p = board.createSVGPoint(); p.x = clientX; p.y = clientY;
    return p.matrixTransform(board.getScreenCTM().inverse());
  }
  // 実描画スケール(px/ユニット)。max-height等で縮小されても getScreenCTM が正しい値を返す
  // （判定用の toBoard と同じ行列なのでゴーストの大きさが盤面と厳密に一致する）。
  function boardScale(){ var m = board.getScreenCTM(); return m ? m.a : (board.getBoundingClientRect().width / board.viewBox.baseVal.width); }

  /* ---- ドラッグ（トレイ→ボード。ゴーストがボード等倍で追従） ---- */
  var pend = null, drag = null;
  function makeGhost(th){
    var vb = th.dataset.vb.split(' ').map(parseFloat); // bx by bw bh
    var s = boardScale();
    var g = document.createElementNS(SVGNS, 'svg');
    g.setAttribute('class', 'ghost');
    g.setAttribute('viewBox', th.dataset.vb);
    g.style.width = (vb[2]*s) + 'px'; g.style.height = (vb[3]*s) + 'px';
    g.style.overflow = 'visible';
    var u = document.createElementNS(SVGNS, 'use');
    u.setAttribute('href', '#'+th.dataset.pid); u.setAttribute('fill', th.dataset.color);
    g.appendChild(u); document.body.appendChild(g);
    // ピース重心のゴースト内オフセット（px）
    var cx = parseFloat(th.dataset.cx), cy = parseFloat(th.dataset.cy);
    return { el:g, s:s, offx:(cx-vb[0])*s, offy:(cy-vb[1])*s };
  }
  function moveGhost(cx, cy){ if(!drag) return;
    drag.el.style.left = (cx - drag.offx) + 'px'; drag.el.style.top = (cy - drag.offy) + 'px'; }
  function startDrag(th, cx, cy){
    drag = makeGhost(th); drag.th = th; th.style.visibility = 'hidden';
    moveGhost(cx, cy); startTimer(); sePick();
  }
  function endDrag(cx, cy){
    if(!drag) return;
    var th = drag.th; drag.el.remove();
    var b = toBoard(cx, cy);
    var hx = parseFloat(th.dataset.cx), hy = parseFloat(th.dataset.cy);
    var ok = Math.hypot(b.x-hx, b.y-hy) < SNAP;
    if(ok){
      var g = document.createElementNS(SVGNS, 'g'); g.setAttribute('class','piece');
      var u = document.createElementNS(SVGNS, 'use'); u.setAttribute('href','#'+th.dataset.pid); u.setAttribute('fill', th.dataset.color);
      g.appendChild(u);
      var cx = th.dataset.cx, cy = parseFloat(th.dataset.cy), rd = th.dataset.reading;
      function mkT(cls, yy, s){ var t=document.createElementNS(SVGNS,'text'); t.setAttribute('class',cls); t.setAttribute('x',cx); t.setAttribute('y',yy); t.textContent=s; return t; }
      if(rd){ g.appendChild(mkT('ruby', cy - PNAME*0.6, rd)); g.appendChild(mkT('name', cy + PNAME*0.34, th.dataset.label)); }
      else { g.appendChild(mkT('name', cy, th.dataset.label)); }
      placed.appendChild(g);
      th.classList.add('gone');
      solved++; progEl.textContent = solved + ' / ' + NP; seSnap();
      if(solved === NP){ done = true; cancelAnimationFrame(raf);
        document.getElementById('wintime').textContent = 'タイム ' + ((Date.now()-t0)/1000).toFixed(1) + '秒';
        winEl.classList.add('show'); seClear(); }
    } else {
      th.style.visibility = ''; // トレイに戻す
    }
    drag = null;
  }

  tray.querySelectorAll('.thumb').forEach(function(th){
    th.addEventListener('pointerdown', function(e){
      if(done || th.classList.contains('gone')) return;
      pend = { th:th, id:e.pointerId, sx:e.clientX, sy:e.clientY, mouse:(e.pointerType==='mouse') };
    });
  });
  document.addEventListener('pointermove', function(e){
    if(drag && (!pend || e.pointerId===pend.id)){ moveGhost(e.clientX, e.clientY); return; }
    if(!pend || e.pointerId!==pend.id) return;
    var dx = e.clientX-pend.sx, dy = e.clientY-pend.sy;
    // マウスは即ドラッグ。タッチは「縦方向の動き」でドラッグ開始（横は tray の横スクロールに任せる）
    if(pend.mouse){ if(Math.abs(dx)+Math.abs(dy) > 3){ var th=pend.th; startDrag(th, e.clientX, e.clientY); } return; }
    if(Math.abs(dy) > 8 && Math.abs(dy) >= Math.abs(dx)){ startDrag(pend.th, e.clientX, e.clientY); }
    else if(Math.abs(dx) > 10){ pend = null; } // 横スクロールと判断
  });
  function pUp(e){
    if(drag){ endDrag(e.clientX, e.clientY); }
    pend = null;
  }
  document.addEventListener('pointerup', pUp);
  document.addEventListener('pointercancel', pUp);

  /* ---- リセット ---- */
  function reset(){
    cancelAnimationFrame(raf); solved = 0; started = false; done = false;
    progEl.textContent = '0 / '+NP; timeEl.textContent = '0.0'; winEl.classList.remove('show');
    while(placed.firstChild) placed.removeChild(placed.firstChild);
    // トレイを戻す＋シャッフル
    var ths = Array.prototype.slice.call(tray.querySelectorAll('.thumb'));
    for(var i=ths.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); tray.insertBefore(ths[j], ths[i].nextSibling); var tmp=ths[i]; ths[i]=ths[j]; ths[j]=tmp; }
    tray.querySelectorAll('.thumb').forEach(function(t){ t.classList.remove('gone'); t.style.visibility=''; });
    tray.scrollLeft = 0;
  }
  document.getElementById('reset').addEventListener('click', reset);
  document.getElementById('again').addEventListener('click', reset);
  document.getElementById('mute').addEventListener('click', function(){
    muted = !muted; this.textContent = muted ? '🔇' : '🔊'; if(!muted) ac();
  });

  // 初回シャッフル
  (function(){ var ths = Array.prototype.slice.call(tray.querySelectorAll('.thumb'));
    for(var i=ths.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); tray.insertBefore(ths[j], ths[i].nextSibling); var tmp=ths[i]; ths[i]=ths[j]; ths[j]=tmp; } })();
})();
</script>
